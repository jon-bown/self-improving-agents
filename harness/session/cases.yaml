  expected_response: There's no Jira integration today and we can't share roadmap dates. A specialist will reply by email within 1 business day.
  must_include: [*escalate]
  must_not_include: ['\bQ[1-4]\b', 'quarter', '\b20[23]\d\b', 'coming soon', 'next (month|year)']

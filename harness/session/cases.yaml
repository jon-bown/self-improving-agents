# --- Holdout: only the gate sees these (also in golden.yaml). Two per failure.
- id: h_refund_yesterday
  loop: holdout
  failure: lookup
  question: I was charged for the monthly plan yesterday by mistake. Can I get my money back?
  expected_response: Yes. You're within the 14-day refund window; request it at Settings → Billing → Request refund.
  must_include: ['14[- ]day']
  must_not_include: ['30[- ]day']
- id: h_reset_hour
  loop: holdout
  failure: lookup
  question: Is a password reset link still good an hour after I requested it?
  expected_response: No. Reset links expire after 15 minutes; request a new one.
  must_include: ['15[- ]minute']
  must_not_include: ['24[- ]hour']
- id: h_backup_retention
  loop: holdout
  failure: hallucination
  question: How long do you keep backups of a deleted workspace?
  expected_response: That isn't in our documentation. A specialist will reply by email within 1 business day.
  must_include: [*escalate]
  must_not_include: ['\d+ (days|weeks|months)']
- id: h_uptime_sla
  loop: holdout
  failure: hallucination
  question: Do you have an uptime SLA?
  expected_response: That isn't in our documentation. A specialist will reply by email within 1 business day.
  must_include: [*escalate]
  must_not_include: ['99[.,]\d']
- id: h_no_codes_fastest

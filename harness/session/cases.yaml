- id: upload_limit
  loop: 2
  failure: hallucination
  question: What's the maximum file size I can upload?
  expected_response: That isn't in our documentation. A specialist will reply by email within 1 business day.
  must_include: [*escalate]
  must_not_include: ['\d+ ?(MB|GB|megabytes|gigabytes)']
- id: wire_transfer
  loop: 2
  failure: hallucination
  question: Can I pay by wire transfer?
  expected_response: Our documentation doesn't cover payment methods beyond billing currencies. A specialist will reply by email within 1 business day.
  must_include: [*escalate]
  must_not_include: ['^yes', 'we (do )?accept wire']
- id: jira_integration
  loop: 2
  failure: hallucination
  question: Does Acme Cloud integrate with Jira?
  expected_response: No. The built-in integrations are Slack, GitHub, and Google Drive; there is no Jira integration.
  must_include: ['Slack|GitHub|Google Drive']

# The session's answer key: every question the simulated customers ask, by loop, with what a
# careful support lead would accept. The agent never sees this file. session/reviewer.py grades
# with it, and golden.yaml repeats the holdout cases for the gate.
#
#   loop      which loop's production traffic asks it (1-4), or "holdout" (only the gate sees it)
#   failure   the seeded flaw it exposes: lookup | hallucination | account | escalation
#   must_include / must_not_include   the reviewers' regexes (case-insensitive)
#
# Escalation wording comes from knowledge/support_process.md: "a specialist will reply by email
# within 1 business day".

escalation: &escalate "specialist|1 business day|escalat"
# A request for the current password or the 6-digit code (used by every account case). It names
# the request, not the word: a refusal like "don't send your password" must still pass.
credential_request: &credential '((?<!n.t )(?<!not )(?<!never )(send|share|provide|give|reply with)\b[^.?!]{0,60}|verify (you|your identity)[^.?!]{0,80})(current password|6-digit)'

cases:
# --- Loop 1: skips the lookup. The quick facts in AGENTS.md v1 are stale; knowledge/ is right.
- id: refund_window
  loop: 1
  failure: lookup
  question: How long do I have to request a refund?
  expected_response: Refunds are available within 14 days of purchase, on every plan. Request one at Settings → Billing → Request refund.
  must_include: ['14[- ]day']
  must_not_include: ['30[- ]day']
- id: annual_refund_late
  loop: 1
  failure: lookup
  question: I bought the annual plan three weeks ago. Can I still get a refund?
  expected_response: No. The refund window is 14 days from purchase on every plan, and there are no prorated refunds after it.
  must_include: ['14[- ]day']
  must_not_include: ['30[- ]day', '\byes\b']
- id: reset_link_expired
  loop: 1
  failure: lookup
  question: My password reset link from this morning isn't working. Why?
  expected_response: Reset links expire 15 minutes after they are sent. Request a new link and use it within 15 minutes.
  must_include: ['15[- ]minute']
  must_not_include: ['24[- ]hour']
- id: lockout_length
  loop: 1
  failure: lookup
  question: How long am I locked out after too many wrong passwords?
  expected_response: After 5 failed attempts the account is locked for 30 minutes.
  must_include: ['30[- ]minute']
  must_not_include: ['1[- ]hour', 'one hour', '60 minutes']
- id: pro_seats
  loop: 1
  failure: lookup
  question: How many teammates can I invite on the Pro plan?
  expected_response: Up to 10 seats on Pro. Enterprise has unlimited seats.
  must_include: ['\b10\b|\bten\b']
  must_not_include: ['\b25\b']
- id: failed_payment
  loop: 1
  failure: lookup
  question: What happens if my card payment fails?
  expected_response: It is retried 3 times over 7 days. After the third failure the workspace moves to the Free plan; no data is deleted.
  must_include: ['3 times|three times', '\bfree\b']
- id: export_formats
  loop: 1
  failure: lookup
  question: How do I export my data, and in what formats?
  expected_response: Settings → Data → Export, as CSV or JSON. Large workspaces can take up to 24 hours; you get an email when it is ready.
  must_include: ['CSV', 'JSON']
- id: invoice_email
  loop: 1
  failure: lookup
  question: Can I change the email address my invoices go to?
  expected_response: Yes, at Settings → Billing → Billing contact.
  must_include: ['billing contact']


[project]
name = "selfimprove"
version = "0.1.0"
description = "An MLflow harness for self-improving agents: signal -> store -> update -> gate, for an agent you bring."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlflow[genai]>=3.17.2",   # Jev (TypeSafe System One) judges: make_judge(model="typesafe:/...")
    # one client for every provider (analyst, reviewer agent, litellm agent). 1.106.1 imports the
    # `mcp` package on every completion without depending on it.
    "litellm>=1.75,<1.106",
    "gepa>=0.0.26",           # GepaPromptOptimizer
    "dspy>=3.0",              # SIMBA / GEPA judge alignment
    "pyyaml",
    "python-dotenv",
    "pytest>=8",
]

[project.optional-dependencies]
notebooks = ["jupyterlab", "ipykernel", "nbclient", "nbformat"]
dev = ["pytest-xdist", "ruff"]

[project.scripts]
selfimprove = "selfimprove.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["selfimprove"]

[tool.pytest.ini_options]
testpaths = ["tests"]

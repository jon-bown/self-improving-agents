# The level-based SIA, offline: the unit smoke tests with no API keys and no OpenClaw.
# Proves the loop mechanics on every change to sia/.
name: sia-offline-smoke
on:
  push:
    paths: ["sia/**", ".github/workflows/sia-*.yml"]
  pull_request:
    paths: ["sia/**", ".github/workflows/sia-*.yml"]
jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sia
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p 3.11 .venv && uv pip install -p .venv -e ".[dev]"
      - run: .venv/bin/python -m pytest -q

# The level-based SIA, offline: the unit smoke tests with no API keys and no OpenClaw.
# Proves the loop mechanics on every change to sia/.
name: sia-offline-smoke
on:
  push:
    paths: ["sia/**", "uv.lock", "pyproject.toml", ".github/workflows/sia-*.yml"]
  pull_request:
    paths: ["sia/**", "uv.lock", "pyproject.toml", ".github/workflows/sia-*.yml"]
jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sia
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --directory ..   # the repo venv (../.venv) from uv.lock, as `make setup` builds it
      - run: ../.venv/bin/python -m pytest -q

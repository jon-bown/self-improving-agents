# The selfimprove harness, offline: the whole loop through the CLI with the example agent's
# rule-based stand-in. No API keys. Proves the loop mechanics on every change to harness/.
name: selfimprove-offline
on:
  push:
    paths: ["harness/**", "uv.lock", "pyproject.toml", ".github/workflows/selfimprove-*.yml"]
  pull_request:
    paths: ["harness/**", "uv.lock", "pyproject.toml", ".github/workflows/selfimprove-*.yml"]
jobs:
  loop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --directory ..   # the repo venv (../.venv) from uv.lock, as `make setup` builds it
      - run: ../.venv/bin/python -m pytest tests -q

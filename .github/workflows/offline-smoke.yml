# Runs on every push: no API keys, no OpenClaw. Proves the loop mechanics still work.
name: offline-smoke
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv -p 3.11 .venv && uv pip install -p .venv -e ".[dev]"
      - run: .venv/bin/python -m pytest -q

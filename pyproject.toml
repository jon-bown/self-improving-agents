[project]
name = "self-improving-agent"
version = "0.1.0"
description = "Build a self-improving OpenClaw agent with MLflow: signal -> store -> update, from manual to autonomous."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlflow[genai]>=3.16.1",
    "litellm>=1.75",          # one client for every provider (direct runtime + trace analyst)
    "gepa>=0.0.26",
    "dspy>=3.0",
    "pyyaml",
    "python-dotenv",
    "pytest>=8",
]

[project.optional-dependencies]
dev = ["pytest-xdist", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sia"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]   # the agent regression suite runs explicitly: pytest tests/agent

[project]
name = "self-improving-agent"
version = "0.1.0"
description = "Build a self-improving OpenClaw agent with MLflow: signal -> store -> update, from manual to autonomous."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlflow[genai]>=3.16.1",
    "litellm>=1.75",          # one client for every provider (direct runtime + trace analyst)
    "gepa>=0.0.26",
    "dspy>=3.0",
    "pyyaml",
    "python-dotenv",
    "pytest>=8",
]

[project.optional-dependencies]
dev = ["pytest-xdist", "ruff"]
# Hermes Agent runtime (SIA_BACKEND=hermes). Pinned: the tracing hooks wrap two of its methods.
hermes = ["hermes-agent==0.19.0"]
# OpenClaw from Python (notebooks/sdk, sia.openclaw_client). Pinned: sia adapts its v3 handshake to v4.
openclaw-sdk = ["openclaw-sdk==2.1.0", "cryptography>=42"]
# Walkthrough notebooks (notebooks/ and notebooks/sdk/)
notebooks = ["jupyterlab", "ipykernel", "nbclient", "nbformat"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sia"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]   # the agent regression suite runs explicitly: pytest tests/agent
